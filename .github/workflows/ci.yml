name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,deep-learning,app]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests examples scripts
      - name: Format check
        run: ruff format --check src tests examples scripts
      - name: Tests and coverage
        run: pytest -q --cov=from_zero --cov-report=term-missing

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: bandit -r src -q -c bandit.yaml
