experiment:
  name: mini_gpt_shakespeare
  seed: 42
  notes: >
    A character-level decoder-only transformer trained on the public-domain Tiny
    Shakespeare corpus. The model is deliberately small and is not an assistant.

data:
  path: data/corpora/tiny_shakespeare.txt
  val_fraction: 0.1

model:
  vocab_size: 0
  context_length: 128
  embedding_dim: 128
  num_heads: 4
  num_layers: 4
  dropout: 0.1
  bias: false
  tie_weights: true

training:
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 3000
  eval_interval: 150
  eval_batches: 10
  log_interval: 10
  grad_clip: 1.0
  warmup_steps: 50
  device: auto

sampling:
  prompt: "\n"
  max_new_tokens: 240
  temperature: 0.9
  top_k: 40

output:
  directory: artifacts/experiments
  make_plots: true
