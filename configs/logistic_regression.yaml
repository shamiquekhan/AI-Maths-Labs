experiment:
  name: logistic_baseline
  seed: 42
  notes: >
    Linear logistic regression on a small two-dimensional dataset. Features are
    standardized using training-split statistics only.

data:
  dataset: linearly_separable
  samples: 800
  noise: 0.22
  test_fraction: 0.2
  val_fraction: 0.2

model:
  learning_rate: 0.08
  epochs: 500
  batch_size: 64
  regularization: 0.001
  threshold: 0.5
  early_stopping_patience: 80
  min_delta: 0.000001

output:
  directory: artifacts/experiments
  make_plots: true
