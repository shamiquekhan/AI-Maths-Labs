[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "from-zero-ai-lab"
version = "0.1.0"
description = "A first-principles AI mathematics and generative modeling laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Creative Commons Attribution 4.0 International"}
license-files = ["LICENSE"]
authors = [{ name = "FROM ZERO contributors" }]
keywords = ["education", "machine-learning", "autodiff", "transformers", "diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deep-learning = ["torch>=2.2", "torchvision>=0.17"]
app = ["streamlit>=1.35"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "nbformat>=5.9",
    "jupyter>=1.0",
]
all = [
    "torch>=2.2",
    "torchvision>=0.17",
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "slow: tests that take more than a few seconds",
    "gpu: tests that require a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501", "B008", "BLE001", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "I001", "B905", "RUF010", "F541", "E702", "RUF003"]
"examples/*" = ["E402", "F401", "I001", "B905", "RUF010", "F541", "E702", "RUF003"]
"tests/*" = ["B011", "B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["from_zero"]
omit = ["*/app/*"]
