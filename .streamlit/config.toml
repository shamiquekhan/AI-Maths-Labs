# Streamlit configuration for FROM ZERO dashboard.
#
# The public deployment runs the strict pure-Python engine and the NumPy
# laboratories. PyTorch-backed pages detect its absence and show installation
# instructions instead of failing at startup.

[server]
headless = true
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25
maxMessageSize = 25

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"

# Coral (light) theme: the app CSS in common.py refines this, so these values
# must stay in step with its tokens or the first paint flashes a different
# shade. Coral is the one accent; the paper is warm grey.
[theme]
base = "light"
primaryColor = "#B23A26"
backgroundColor = "#F4F0E8"
secondaryBackgroundColor = "#FCFAF6"
textColor = "#211C17"
font = "sans serif"

[runner]
magicEnabled = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s %(name)s: %(message)s"
