experiment:
  name: ddpm_smoke
  seed: 1
  notes: ''
data:
  dataset: synthetic
  image_size: 8
  max_samples: 32
  data_dir: data
  download: true
diffusion:
  timesteps: 10
  schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  cosine_s: 0.008
model:
  in_channels: 1
  base_channels: 8
  channel_mults:
  - 1
  - 2
  num_res_blocks: 1
  dropout: 0.0
training:
  batch_size: 4
  learning_rate: 0.0002
  weight_decay: 0.0
  max_steps: 3
  eval_interval: 3
  eval_batches: 1
  log_interval: 1
  grad_clip: 1.0
  device: cpu
sampling:
  sample_count: 4
  sample_interval: 3
output:
  directory: artifacts/experiments
  make_plots: true
