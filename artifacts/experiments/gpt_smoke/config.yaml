experiment:
  name: gpt_smoke
  seed: 1
  notes: ''
data:
  path: data/corpora/tiny_shakespeare.txt
  val_fraction: 0.1
model:
  vocab_size: 0
  context_length: 16
  embedding_dim: 16
  num_heads: 2
  num_layers: 1
  dropout: 0.0
  bias: false
  tie_weights: true
training:
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 5
  eval_interval: 5
  eval_batches: 1
  log_interval: 1
  grad_clip: 1.0
  warmup_steps: 0
  device: cpu
sampling:
  prompt: ROMEO
  max_new_tokens: 10
  temperature: 0.9
  top_k: 40
output:
  directory: artifacts/experiments
  make_plots: true
