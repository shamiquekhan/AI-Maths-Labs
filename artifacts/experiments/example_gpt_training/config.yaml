experiment:
  name: example_gpt_training
  seed: 42
  notes: ''
data:
  path: data/corpora/tiny_shakespeare.txt
  val_fraction: 0.1
model:
  vocab_size: 0
  context_length: 32
  embedding_dim: 32
  num_heads: 2
  num_layers: 1
  dropout: 0.0
  bias: false
  tie_weights: true
training:
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.01
  max_steps: 20
  eval_interval: 10
  eval_batches: 2
  log_interval: 5
  grad_clip: 1.0
  warmup_steps: 0
  device: cpu
sampling:
  prompt: 'ROMEO:'
  max_new_tokens: 30
  temperature: 0.8
  top_k: 10
output:
  directory: artifacts/experiments
  make_plots: true
